<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d14;
    font-family: 'Space Grotesk', sans-serif;
    padding: 2rem;
  }

  .player {
    background: #13131f;
    border: 1px solid #2a2a3d;
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }

  /* ── Top section ── */
  .player-top {
    padding: 2rem 2rem 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  /* ── Vinyl ── */
  .vinyl-wrap {
    position: relative;
    width: 172px;
    height: 172px;
  }

  .vinyl {
    width: 172px;
    height: 172px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #1a1a2e 0deg,   #16213e 45deg,
      #0f3460 90deg,  #1a1a2e 135deg,
      #16213e 180deg, #0f3460 225deg,
      #1a1a2e 270deg, #16213e 315deg,
      #0f3460 360deg
    );
    position: relative;
    border: 3px solid #2a2a3d;
    /* concentric groove rings */
    box-shadow:
      inset 0 0 0 16px rgba(255,255,255,0.025),
      inset 0 0 0 32px rgba(0,0,0,0.15),
      inset 0 0 0 48px rgba(255,255,255,0.02),
      inset 0 0 0 64px rgba(0,0,0,0.1);
  }

  .vinyl.spinning {
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .vinyl-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.6px;
    border: 2px solid rgba(255,255,255,0.15);
    white-space: pre-line;
  }

  .vinyl-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #0d0d14;
    border: 1.5px solid #3a3a50;
    z-index: 2;
  }

  /* ── Tonearm ── */
  .tonearm {
    position: absolute;
    top: 6px;
    right: -14px;
    width: 64px;
    height: 88px;
    transform-origin: top right;
    transform: rotate(-15deg);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .tonearm.active {
    transform: rotate(-30deg);
  }

  .tonearm svg {
    width: 100%;
    height: 100%;
  }

  /* ── Track info ── */
  .track-info {
    text-align: center;
  }

  .track-title {
    font-size: 20px;
    font-weight: 600;
    color: #f0f0ff;
    letter-spacing: -0.4px;
    line-height: 1.2;
  }

  .track-artist {
    font-size: 13px;
    color: #7070a0;
    margin-top: 4px;
    font-weight: 400;
  }

  /* ── Bottom section ── */
  .player-bottom {
    padding: 0 1.75rem 1.75rem;
  }

  /* ── Progress ── */
  .progress-area {
    margin-bottom: 1.25rem;
  }

  .progress-bar-wrap {
    position: relative;
    height: 4px;
    background: #2a2a3d;
    border-radius: 2px;
    cursor: pointer;
    margin-bottom: 8px;
  }

  .progress-bar-wrap:hover .progress-handle {
    transform: translate(-50%, -50%) scale(1.25);
  }

  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #7c3aed, #2563eb);
    transition: width 0.25s linear;
    pointer-events: none;
  }

  .progress-handle {
    position: absolute;
    top: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #7c3aed;
    transform: translate(-50%, -50%);
    transition: left 0.25s linear, transform 0.15s;
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.25);
    pointer-events: none;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #5a5a80;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 1.25rem;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #5a5a80;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    transition: all 0.15s;
    padding: 0;
    flex-shrink: 0;
  }

  .ctrl-btn:hover {
    background: #1e1e30;
    color: #c0c0e0;
  }

  .ctrl-btn i {
    font-size: 20px;
    display: block;
  }

  .ctrl-btn.active-ctrl {
    color: #7c3aed;
  }

  .ctrl-btn.active-ctrl:hover {
    color: #9d5ef5;
  }

  .play-btn {
    width: 52px !important;
    height: 52px !important;
    background: linear-gradient(135deg, #7c3aed, #2563eb) !important;
    color: #fff !important;
    border-radius: 50% !important;
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
  }

  .play-btn:hover {
    opacity: 0.9;
    transform: scale(1.06);
    background: linear-gradient(135deg, #7c3aed, #2563eb) !important;
    color: #fff !important;
  }

  .play-btn i {
    font-size: 22px !important;
  }

  /* ── Volume ── */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .volume-row i {
    font-size: 16px;
    color: #5a5a80;
    flex-shrink: 0;
  }

  input[type="range"].vol-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    background: #2a2a3d;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"].vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
  }

  input[type="range"].vol-slider::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    cursor: pointer;
    border: none;
  }

  .vol-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #5a5a80;
    min-width: 34px;
    text-align: right;
  }

  /* ── Playlist ── */
  .playlist {
    border-top: 1px solid #1e1e30;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2a2a3d transparent;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb { background: #2a2a3d; border-radius: 2px; }

  .pl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 1.75rem;
    cursor: pointer;
    transition: background 0.1s;
    border-left: 3px solid transparent;
  }

  .pl-item:hover {
    background: #18182a;
  }

  .pl-item.active {
    border-left-color: #7c3aed;
    background: #18182a;
  }

  .pl-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #5a5a80;
    width: 16px;
    text-align: center;
    flex-shrink: 0;
  }

  .pl-item.active .pl-num {
    display: none;
  }

  /* Equalizer animation */
  .pl-eq {
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    flex-shrink: 0;
    width: 16px;
  }

  .pl-item.active .pl-eq {
    display: flex;
  }

  .pl-bar {
    width: 3px;
    border-radius: 1px;
    background: #7c3aed;
  }

  .pl-bar:nth-child(1) { height: 14px; animation: eq 0.55s ease-in-out infinite alternate; }
  .pl-bar:nth-child(2) { height: 10px; animation: eq 0.55s ease-in-out 0.18s infinite alternate; }
  .pl-bar:nth-child(3) { height: 6px;  animation: eq 0.55s ease-in-out 0.36s infinite alternate; }

  @keyframes eq {
    to { height: 3px; }
  }

  .pl-item.active.paused .pl-bar {
    animation-play-state: paused;
  }

  .pl-info {
    flex: 1;
    min-width: 0;
  }

  .pl-title {
    font-size: 13px;
    font-weight: 500;
    color: #d0d0f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pl-item.active .pl-title {
    color: #a78bfa;
  }

  .pl-artist {
    font-size: 11px;
    color: #5a5a80;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pl-dur {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: #5a5a80;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="player" role="region" aria-label="Music Player">

  <!-- Top -->
  <div class="player-top">

    <!-- Vinyl + tonearm -->
    <div class="vinyl-wrap">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label" id="label-text">LUNAR&#10;ECHO</div>
        <div class="vinyl-center"></div>
      </div>
      <div class="tonearm" id="tonearm" aria-hidden="true">
        <svg viewBox="0 0 64 88" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="56" cy="7" r="6" fill="#2a2a3d" stroke="#3a3a55" stroke-width="1.5"/>
          <line x1="56" y1="13" x2="18" y2="78" stroke="#3a3a55" stroke-width="3" stroke-linecap="round"/>
          <circle cx="18" cy="80" r="4" fill="#7c3aed"/>
        </svg>
      </div>
    </div>

    <!-- Track info -->
    <div class="track-info">
      <div class="track-title" id="track-title">Midnight Bloom</div>
      <div class="track-artist" id="track-artist">Lunar Echo</div>
    </div>

  </div>

  <!-- Bottom -->
  <div class="player-bottom">

    <!-- Progress bar -->
    <div class="progress-area">
      <div class="progress-bar-wrap" id="prog-wrap" role="slider"
           aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
        <div class="progress-handle" id="prog-handle" style="left:0%"></div>
      </div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">3:34</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
        <i class="ti ti-arrows-shuffle" aria-hidden="true"></i>
      </button>
      <button class="ctrl-btn" id="btn-prev" title="Previous" aria-label="Previous track">
        <i class="ti ti-player-skip-back" aria-hidden="true"></i>
      </button>
      <button class="ctrl-btn play-btn" id="btn-play" title="Play" aria-label="Play">
        <i class="ti ti-player-play" id="play-icon" aria-hidden="true"></i>
      </button>
      <button class="ctrl-btn" id="btn-next" title="Next" aria-label="Next track">
        <i class="ti ti-player-skip-forward" aria-hidden="true"></i>
      </button>
      <button class="ctrl-btn" id="btn-repeat" title="Repeat" aria-label="Repeat" aria-pressed="false">
        <i class="ti ti-repeat" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-row">
      <i class="ti ti-volume" id="vol-icon" aria-hidden="true"></i>
      <input type="range" class="vol-slider" id="vol-slider"
             min="0" max="100" value="75" step="1" aria-label="Volume">
      <span class="vol-label" id="vol-label">75%</span>
    </div>

  </div>

  <!-- Playlist -->
  <div class="playlist" id="playlist" role="list" aria-label="Playlist"></div>

</div>

<script>
  // ── Track data ──────────────────────────────────────────────────
  const tracks = [
    { title: "Midnight Bloom",   artist: "Lunar Echo",           duration: 214, label: "LUNAR\nECHO" },
    { title: "Neon Drift",       artist: "Synthwave Collective",  duration: 187, label: "SWC\n2024" },
    { title: "Crystal Tide",     artist: "Aurora Waves",          duration: 243, label: "AURORA\nWAVES" },
    { title: "Static Dreams",    artist: "The Hollow",            duration: 198, label: "HOLLOW\n03" },
    { title: "Orbit",            artist: "Cosmo & The Void",      duration: 231, label: "COSMO\nVOID" },
  ];

  // ── State ───────────────────────────────────────────────────────
  let currentIndex = 0;
  let isPlaying    = false;
  let elapsed      = 0;
  let timer        = null;
  let shuffleOn    = false;
  let repeatOn     = false;

  // ── DOM refs ────────────────────────────────────────────────────
  const vinyl       = document.getElementById('vinyl');
  const tonearm     = document.getElementById('tonearm');
  const labelText   = document.getElementById('label-text');
  const titleEl     = document.getElementById('track-title');
  const artistEl    = document.getElementById('track-artist');
  const progFill    = document.getElementById('prog-fill');
  const progHandle  = document.getElementById('prog-handle');
  const progWrap    = document.getElementById('prog-wrap');
  const timeCur     = document.getElementById('time-cur');
  const timeTot     = document.getElementById('time-tot');
  const playIcon    = document.getElementById('play-icon');
  const btnPlay     = document.getElementById('btn-play');
  const btnShuffle  = document.getElementById('btn-shuffle');
  const btnRepeat   = document.getElementById('btn-repeat');
  const volSlider   = document.getElementById('vol-slider');
  const volLabel    = document.getElementById('vol-label');
  const volIcon     = document.getElementById('vol-icon');
  const playlist    = document.getElementById('playlist');

  // ── Helpers ─────────────────────────────────────────────────────
  function fmt(s) {
    const m   = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function pickNext() {
    if (shuffleOn) {
      let n;
      do { n = Math.floor(Math.random() * tracks.length); } while (n === currentIndex && tracks.length > 1);
      return n;
    }
    return (currentIndex + 1) % tracks.length;
  }

  function pickPrev() {
    if (shuffleOn) return Math.floor(Math.random() * tracks.length);
    return (currentIndex - 1 + tracks.length) % tracks.length;
  }

  // ── Load a track ─────────────────────────────────────────────────
  function loadTrack(i) {
    currentIndex = i;
    const t = tracks[i];
    titleEl.textContent  = t.title;
    artistEl.textContent = t.artist;
    labelText.textContent = t.label;
    timeTot.textContent   = fmt(t.duration);
    elapsed = 0;
    updateProgress();
    updatePlaylistUI();
  }

  // ── Update progress bar ──────────────────────────────────────────
  function updateProgress() {
    const dur = tracks[currentIndex].duration;
    const pct = dur ? Math.min((elapsed / dur) * 100, 100) : 0;
    const pctStr = pct.toFixed(2) + '%';
    progFill.style.width  = pctStr;
    progHandle.style.left = pctStr;
    timeCur.textContent   = fmt(elapsed);
    progWrap.setAttribute('aria-valuenow', Math.round(pct));
  }

  // ── Update playlist highlight ────────────────────────────────────
  function updatePlaylistUI() {
    document.querySelectorAll('.pl-item').forEach((el, idx) => {
      el.classList.toggle('active', idx === currentIndex);
      el.classList.toggle('paused', !isPlaying);
      el.setAttribute('aria-current', idx === currentIndex ? 'true' : 'false');
    });
  }

  // ── Start / stop playback ────────────────────────────────────────
  function setPlaying(state) {
    isPlaying = state;

    // Update icon
    playIcon.className = isPlaying ? 'ti ti-player-pause' : 'ti ti-player-play';
    btnPlay.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');

    // Animate vinyl & arm
    vinyl.classList.toggle('spinning', isPlaying);
    tonearm.classList.toggle('active', isPlaying);

    updatePlaylistUI();

    if (isPlaying) {
      clearInterval(timer);
      timer = setInterval(() => {
        elapsed++;
        updateProgress();
        if (elapsed >= tracks[currentIndex].duration) {
          if (repeatOn) {
            elapsed = 0;
          } else {
            skipTo(pickNext());
          }
        }
      }, 1000);
    } else {
      clearInterval(timer);
    }
  }

  // ── Skip to track & autoplay ─────────────────────────────────────
  function skipTo(i) {
    clearInterval(timer);
    isPlaying = false;
    loadTrack(i);
    setPlaying(true);
  }

  // ── Controls ─────────────────────────────────────────────────────
  btnPlay.addEventListener('click', () => setPlaying(!isPlaying));

  document.getElementById('btn-next').addEventListener('click', () => skipTo(pickNext()));
  document.getElementById('btn-prev').addEventListener('click', () => {
    // Restart track if past 3 s, otherwise go previous
    if (elapsed > 3) {
      elapsed = 0; updateProgress();
    } else {
      skipTo(pickPrev());
    }
  });

  btnShuffle.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    btnShuffle.classList.toggle('active-ctrl', shuffleOn);
    btnShuffle.setAttribute('aria-pressed', shuffleOn);
  });

  btnRepeat.addEventListener('click', () => {
    repeatOn = !repeatOn;
    btnRepeat.classList.toggle('active-ctrl', repeatOn);
    btnRepeat.setAttribute('aria-pressed', repeatOn);
  });

  // ── Seek ─────────────────────────────────────────────────────────
  let seeking = false;

  function seekTo(e) {
    const rect = progWrap.getBoundingClientRect();
    const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    elapsed = Math.round(pct * tracks[currentIndex].duration);
    updateProgress();
  }

  progWrap.addEventListener('mousedown', e => { seeking = true; seekTo(e); });
  document.addEventListener('mousemove',  e => { if (seeking) seekTo(e); });
  document.addEventListener('mouseup',    ()  => { seeking = false; });

  // Touch seek
  progWrap.addEventListener('touchstart', e => {
    seeking = true; seekTo(e.touches[0]); e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchmove',  e => { if (seeking) seekTo(e.touches[0]); });
  document.addEventListener('touchend',   ()  => { seeking = false; });

  // ── Volume ───────────────────────────────────────────────────────
  volSlider.addEventListener('input', () => {
    const v = parseInt(volSlider.value);
    volLabel.textContent = v + '%';
    volIcon.className = v === 0
      ? 'ti ti-volume-off'
      : v < 50 ? 'ti ti-volume-2' : 'ti ti-volume';
  });

  // ── Build playlist ───────────────────────────────────────────────
  tracks.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'pl-item' + (i === 0 ? ' active' : '');
    div.setAttribute('role', 'listitem');
    div.setAttribute('aria-current', i === 0 ? 'true' : 'false');
    div.setAttribute('tabindex', '0');
    div.innerHTML = `
      <div class="pl-eq" aria-hidden="true">
        <div class="pl-bar"></div>
        <div class="pl-bar"></div>
        <div class="pl-bar"></div>
      </div>
      <div class="pl-num">${i + 1}</div>
      <div class="pl-info">
        <div class="pl-title">${t.title}</div>
        <div class="pl-artist">${t.artist}</div>
      </div>
      <div class="pl-dur">${fmt(t.duration)}</div>
    `;
    div.addEventListener('click',   () => skipTo(i));
    div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skipTo(i); } });
    playlist.appendChild(div);
  });

  // ── Init ─────────────────────────────────────────────────────────
  loadTrack(0);
</script>
</body>
</html>
